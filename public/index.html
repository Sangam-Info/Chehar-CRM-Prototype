<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Chehar CRM — prototype dealer, dukandar, quotation and courier-dispatch system for Chehar Detergent Pvt Ltd. Built by Sangam InfoAnalytics.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1d4ed8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>Chehar CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   CHEHAR CRM — prototype by Sangam InfoAnalytics
   Direction: "white ledger" — a flat, paper-white enterprise console.
   Top app bar + horizontal module navigation, centred content column,
   bordered cards with no shadows or blur, navy primary for head office,
   teal for the dealer portal, amber for the customer portal.
   ============================================================ */
:root{
  --bg:#f5f6f8; --bg-2:#eef0f3;
  --panel:#ffffff; --panel-2:#ffffff;
  --glass:#f7f8fa; --glass-2:#eef0f3;
  --line:#e3e6eb; --line-2:#cfd4dc;
  --fg:#161a22; --fg-dim:#3d4553; --muted:#6b7483; --muted-2:#98a0ad;
  --navy:#1d4ed8; --navy-deep:#1e3a8a;
  --teal:#0f766e; --teal-deep:#115e59;
  --amber:#c2410c; --amber-deep:#9a3412;
  --accent:#1d4ed8; --accent-deep:#1e3a8a; --accent-soft:#e8eefc;
  --good:#15803d; --good-soft:#e7f5ec;
  --warn:#b45309; --warn-soft:#fdf1e1;
  --crit:#b91c1c; --crit-soft:#fbe9e9;
  --info:#1d4ed8; --info-soft:#e8eefc;
  --control-bg:#ffffff;
  --doc-bg:#ffffff; --doc-wm:rgba(22,26,34,0.045);
  --map-land:#eef1f5; --map-line:#b8c0cc; --map-grid:#eaedf1; --map-bg:#f9fafb;
  --scrim:rgba(22,26,34,0.45);
  --radius:8px; --radius-sm:6px;
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Source Sans 3',system-ui,sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111418; --bg-2:#171b21; --panel:#1a1f26; --panel-2:#1f252e;
  --glass:#20262f; --glass-2:#2a313b; --line:#2b323c; --line-2:#3b434f;
  --fg:#e9edf3; --fg-dim:#c2c9d4; --muted:#8e97a5; --muted-2:#656e7b;
  --navy:#6b93ff; --navy-deep:#3b63d6; --teal:#2dd4bf; --teal-deep:#14b8a6; --amber:#fb923c; --amber-deep:#ea580c;
  --accent:#6b93ff; --accent-deep:#3b63d6; --accent-soft:#1f2a46;
  --good:#4ade80; --good-soft:#15291d; --warn:#fbbf24; --warn-soft:#2e2412; --crit:#f87171; --crit-soft:#331a1a; --info:#6b93ff; --info-soft:#1f2a46;
  --control-bg:#161b21; --doc-bg:#1a1f26; --doc-wm:rgba(255,255,255,0.05);
  --map-land:#232a34; --map-line:#4b5563; --map-grid:#1f252e; --map-bg:#171b21;
  --scrim:rgba(0,0,0,0.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111418; --bg-2:#171b21; --panel:#1a1f26; --panel-2:#1f252e;
  --glass:#20262f; --glass-2:#2a313b; --line:#2b323c; --line-2:#3b434f;
  --fg:#e9edf3; --fg-dim:#c2c9d4; --muted:#8e97a5; --muted-2:#656e7b;
  --navy:#6b93ff; --navy-deep:#3b63d6; --teal:#2dd4bf; --teal-deep:#14b8a6; --amber:#fb923c; --amber-deep:#ea580c;
  --accent:#6b93ff; --accent-deep:#3b63d6; --accent-soft:#1f2a46;
  --good:#4ade80; --good-soft:#15291d; --warn:#fbbf24; --warn-soft:#2e2412; --crit:#f87171; --crit-soft:#331a1a; --info:#6b93ff; --info-soft:#1f2a46;
  --control-bg:#161b21; --doc-bg:#1a1f26; --doc-wm:rgba(255,255,255,0.05);
  --map-land:#232a34; --map-line:#4b5563; --map-grid:#1f252e; --map-bg:#171b21;
  --scrim:rgba(0,0,0,0.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:relative;z-index:2;height:100%}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-0.01em}
a{color:inherit}
button{font-family:inherit}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.vin>*{animation:fadeIn .25s ease both}

.eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:4px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--glass);white-space:nowrap;color:var(--fg-dim);line-height:1.5}
.chip.good{color:var(--good);background:var(--good-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.crit{color:var(--crit);background:var(--crit-soft);border-color:transparent}
.chip.info{color:var(--info);background:var(--info-soft);border-color:transparent}
.chip.accent{color:var(--accent-deep);background:var(--accent-soft);border-color:transparent}
.chip.sm{padding:0 6px;font-size:10.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}
.dot.live{position:relative}
.dot.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--good);animation:ping 1.6s ease-out infinite}
.lock{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:var(--muted);background:var(--glass);border:1px dashed var(--line-2);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:1px solid var(--line-2);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--glass);border-color:var(--muted-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit-soft);background:var(--crit-soft)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.xs{padding:2px 8px;font-size:11.5px;border-radius:4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-width:0}
.soft{background:var(--glass);border:1px solid var(--line);border-radius:var(--radius-sm);min-width:0}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.strong{font-weight:700}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--fg-dim);font-weight:600;min-width:0}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--fg);background:var(--control-bg);border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8px 11px;width:100%;transition:border-color .12s,box-shadow .12s;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--glass)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--glass)}
tbody tr.clickable{cursor:pointer}
.t-wrap{overflow-x:auto;min-width:0}
.r{text-align:right}.c{text-align:center}

/* ---- login (centred card) ---- */
.login-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.login-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;max-width:560px}
.login-hero h1{font-size:26px}
.hero-tag{color:var(--muted);font-size:14.5px;max-width:52ch}
.hero-feats{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.hero-feat{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--fg-dim)}
.hero-feat .tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none;font-size:10px;font-weight:700}
.login-form-pane{width:min(440px,100%)}
.login-card{width:100%;padding:26px;animation:popIn .3s ease both}
.brand-mark{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:#fff;flex:none;font-family:var(--font-display);font-weight:700;font-size:18px}
.creds-box{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
.creds-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;background:var(--glass);font-size:12.5px;font-weight:600}
.creds-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:12px}
.creds-row code{font-family:var(--font-mono);background:var(--glass-2);padding:2px 6px;border-radius:4px;cursor:pointer;font-size:11px}
.creds-row .who{display:flex;align-items:center;gap:7px;min-width:0}
.creds-row .who .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.portal-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(760px,100%)}
.portal-card{padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:3px}
.portal-card b{font-family:var(--font-display);font-size:13px}
.portal-card .pc-ico{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;margin-bottom:4px}
@media (max-width:700px){.portal-cards{grid-template-columns:1fr 1fr}}

/* ---- admin shell: app bar + module nav ---- */
.shell{display:flex;flex-direction:column;height:100%}
.appbar{display:flex;align-items:center;gap:14px;padding:9px max(18px,env(safe-area-inset-right,0px)) 9px max(18px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brandbar{display:flex;align-items:center;gap:10px}
.modnav{display:flex;gap:2px;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.nav-item{position:relative;display:flex;align-items:center;gap:7px;padding:11px 12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s}
.nav-item:hover{color:var(--fg)}
.nav-item.active{color:var(--accent-deep);border-bottom-color:var(--accent)}
.nav-item.locked{opacity:.45}
.ni-ico{display:none}
.ni-badge{font-family:var(--font-mono);font-size:10px;padding:0 6px;border-radius:999px;background:var(--crit);color:#fff;font-weight:600;line-height:16px}
.ni-badge.info{background:var(--accent)}
.nav-sect{display:none}
.main{flex:1;overflow-y:auto;min-width:0}
.main>.container{max-width:1320px;margin:0 auto;padding:22px max(clamp(16px,2.4vw,28px),env(safe-area-inset-right,0px)) 40px max(clamp(16px,2.4vw,28px),env(safe-area-inset-left,0px))}
.user-chip{display:flex;align-items:center;gap:9px;padding:4px 6px 4px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel)}
.avatar{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--accent);flex:none}
.icon-btn{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--panel);color:var(--fg);cursor:pointer;font-size:15px;display:grid;place-items:center}
.icon-btn:hover{background:var(--glass)}
.topsearch{position:relative;min-width:220px;flex:1;max-width:420px}
.topsearch input{padding-left:30px;background:var(--glass)}
.topsearch span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;max-height:320px;overflow:auto;padding:6px;box-shadow:0 10px 30px -12px rgba(0,0,0,.25)}
.search-pop .hit{padding:8px 10px;border-radius:5px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:12.5px}
.search-pop .hit:hover{background:var(--glass)}
.nav-mobile{display:none}

.page-head{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.page-head h1{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.kpi{padding:14px 18px;position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 -1px 0}
.kpi .k-lbl{font-size:12px;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:4px;letter-spacing:-.02em;line-height:1.1}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi .k-stripe,.kpi .k-glow{display:none}
.kpi.clickable{cursor:pointer}
.kpi.clickable:hover{background:var(--glass)}
.sect-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.panel-head h3{font-size:14.5px}
.panel-body{padding:14px 16px}
.bar-row{display:grid;grid-template-columns:120px 1fr 64px;align-items:center;gap:10px;margin:8px 0}
.bar-track{height:7px;border-radius:3px;background:var(--glass-2);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .6s ease}
.spark{display:block;width:100%;height:60px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:120px}
.seg{display:inline-flex;gap:0;border-bottom:1px solid var(--line);flex-wrap:wrap;width:100%}
.seg button{border:none;background:transparent;color:var(--muted);padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--accent-deep);border-bottom-color:var(--accent)}
.seg button .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pager button{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--line-2);background:var(--panel);color:var(--fg);cursor:pointer}
.pill{font-size:11px;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--fg-dim);background:var(--glass);white-space:nowrap}
.tier-P{color:#6d28d9}.tier-G{color:var(--warn)}.tier-S{color:var(--muted)}

.steps{display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;flex:1;position:relative;text-align:center}
.step .sd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);z-index:1}
.step .sl{font-size:11px;color:var(--muted);font-weight:600;line-height:1.2;padding:0 4px}
.step::before{content:"";position:absolute;top:11px;left:50%;width:100%;height:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done .sd{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done::before{background:var(--accent)}
.step.done .sl{color:var(--fg-dim)}
.step.cur .sd{border-color:var(--accent);color:var(--accent-deep);animation:pulse 1.8s infinite}
.step.cur .sl{color:var(--fg);font-weight:700}

.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--glass);border-radius:var(--radius) var(--radius) 0 0}
.kcol-head h4{font-size:12.5px}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow-y:auto}
.kcard{padding:10px 11px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--panel);cursor:pointer}
.kcard:hover{border-color:var(--accent)}
.kcard .kc-title{font-weight:700;font-size:12.5px}
.kcard .kc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kcard .kc-val{font-family:var(--font-display);font-size:14px;margin-top:6px;color:var(--accent-deep)}

.tl{position:relative;padding-left:24px;display:flex;flex-direction:column;gap:14px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;font-size:13px}
.tl-item::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--line-2)}
.tl-item.done::before{background:var(--accent);border-color:var(--accent)}
.tl-item.cur::before{border-color:var(--accent);background:var(--panel);animation:pulse 1.8s infinite}
.tl-item.cur .tl-t{color:var(--fg);font-weight:700}
.tl-t{font-weight:600;color:var(--fg-dim)}
.tl-s{font-size:11.5px;color:var(--muted)}
.eta-band{padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eta-band .eta{font-family:var(--font-display);font-size:22px;color:var(--accent-deep)}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px}
.pcard{padding:12px;display:flex;flex-direction:column;gap:8px;position:relative}

function bindGlobalSearch(){const inp=$('#globalSearch'),pop=$('#searchPop');if(!inp)return;

function routeView(){stopTimer();const v=$('#view');const map={dashboard:viewDashboard,leads:viewLeads,dealers:viewDealers,orders:viewOrders,quotes:viewQuotes,deals:viewDeals,dispatch:viewDispatch,customers:viewCustomers,products:viewProducts,reports:viewReports,users:viewUsers,settings:viewSettings};

      <div class="soft" style="padding:12px;margin-top:12px"><div class="spread tiny"><span class="muted">Subtotal after discount</span><b class="num">${inr(t.sub)}</b></div><div class="spread tiny"><span class="muted">GST ${SETTINGS.gst}%</span><b class="num">${inr(t.gst)}</b></div><div class="spread tiny"><span class="muted">Freight</span><b class="num">${inr(t.freight)}</b></div><div class="spread" style="margin-top:6px;font-family:var(--font-display);font-size:18px"><span>Grand total</span><span style="color:var(--accent-deep)">${inr(t.grand)}</span></div></div>
      <div class="row" style="margin-top:16px;justify-content:space-between"><span class="lock">🔒 PDF · WhatsApp send — licensed version</span><div class="row"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="qb_send">Send quotation to dealer →</button></div></div>`,true);
    const reb=()=>{$$('[data-qi]').forEach(i=>{draft.lines[+i.dataset.qi].qty=Math.max(1,+i.value||1);});$$('[data-ri]').forEach(i=>{draft.lines[+i.dataset.ri].rate=Math.max(1,+i.value||1);});$$('[data-di]').forEach(i=>{draft.lines[+i.dataset.di].disc=Math.min(40,Math.max(0,+i.value||0));});draft.freight=+$('#qb_freight').value||0;draft.validity=+$('#qb_valid').value||7;draft.note=$('#qb_note').value;};
    $$('[data-qi],[data-ri],[data-di],#qb_freight').forEach(i=>i.addEventListener('change',()=>{reb();render();}));
    $('#qb_send').addEventListener('click',()=>{reb();draft.sentOn=NOW.getTime();draft.terms=$('#qb_terms').value;draft.by=STATE.user.name;o.quote=draft;o.items=draft.lines.map(l=>({pid:l.pid,qty:l.qty}));o.status='Quoted';o.history.push({t:NOW.getTime(),label:'Quotation '+draft.id+(draft.rev>1?' rev '+draft.rev:'')+' sent to dealer · '+inr(quoteTotals(draft).grand),by:STATE.user.name});closeModal();routeView();toast('Quotation '+draft.id+' sent — dealer can accept from their portal','good');notify(d.contact,'Quotation '+draft.id+' for '+inr(quoteTotals(draft).grand)+' is ready in your portal');});};
  render();}
function quoteDoc(o){const q=o.quote,d=DMAP[o.dealer],t=quoteTotals(q);
  return `<div class="doc"><div class="doc-wm">QUOTE</div><div class="doc-head"><div><div style="font-family:var(--font-display);font-weight:700;font-size:16px">${esc(COMPANY.name)}</div><div class="muted tiny">${esc(COMPANY.addr)}</div><div class="muted tiny mono">GSTIN ${COMPANY.gstin} · ${COMPANY.phone}</div></div><div style="text-align:right"><div class="eyebrow">Quotation</div><div style="font-family:var(--font-display);font-weight:700">${q.id}${q.rev>1?' · rev '+q.rev:''}</div><div class="muted tiny">${q.sentOn?fmtD(q.sentOn):'draft'} · valid ${q.validity} days</div></div></div>
    <div class="doc-line"><span class="muted">To</span><span><b>${esc(d.name)}</b>, ${esc(d.city)}, ${esc(d.state)} · GSTIN ${d.gstin}</span></div><div class="doc-line"><span class="muted">Against order</span><span class="mono">${o.id}</span></div>
    <div class="t-wrap"><table><thead><tr><th>#</th><th>Product</th><th class="r">Cases</th><th class="r">Units</th><th class="r">Rate</th><th class="r">Disc</th><th class="r">Amount</th></tr></thead><tbody>${q.lines.map((l,i)=>{const p=PMAP[l.pid];return `<tr><td class="muted">${i+1}</td><td>${esc(p.name)} <span class="muted tiny">${esc(p.pack)}</span></td><td class="r num">${l.qty}</td><td class="r num">${l.qty*p.upc}</td><td class="r num">${inr(l.rate)}</td><td class="r num">${l.disc}%</td><td class="r num">${inr(l.qty*p.upc*l.rate*(1-l.disc/100))}</td></tr>`;}).join('')}</tbody></table></div>
    <div class="doc-line"><span class="muted">Subtotal</span><span class="mono">${inr(t.sub)}</span></div><div class="doc-line"><span class="muted">GST ${SETTINGS.gst}%</span><span class="mono">${inr(t.gst)}</span></div><div class="doc-line"><span class="muted">Freight</span><span class="mono">${t.freight?inr(t.freight):'Free (own fleet)'}</span></div>
    <div class="net-band"><div><div class="eyebrow">Grand total</div><div class="muted tiny">Terms: ${esc(q.terms||d.terms)} · ${esc(q.note)}</div></div><div style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--accent-deep)">${inr(t.grand)}</div></div></div>`;}
function quoteView(id){const o=orderById(id);openModal(`${quoteDoc(o)}<div class="row" style="margin-top:14px;justify-content:space-between"><span class="lock">🔒 Download PDF · e-sign — licensed version</span><div class="row"><button class="btn ghost" onclick="closeModal()">Close</button>${o.status==='Quoted'&&canAcceptOrders()?`<button class="btn" id="qv_rev">Revise quotation</button>`:''}</div></div>`,true);const r=$('#qv_rev');if(r)r.addEventListener('click',()=>quoteBuilder(id));}

/* ---------- QUOTATIONS ---------- */
function viewQuotes(v){
  const all=ORDERS.filter(o=>o.quote);const st=(o)=>o.status==='Quoted'?(NOW-o.quote.sentOn>o.quote.validity*DAY?'Expired':'Awaiting dealer'):o.status==='Quote Declined'?'Declined':o.status==='Accepted'?'Draft':'Accepted';
  const tabs=['all','Awaiting dealer','Accepted','Expired','Declined'];let list=all.slice();if(STATE.quoteTab!=='all')list=list.filter(o=>st(o)===STATE.quoteTab);
  const val=(k)=>all.filter(o=>st(o)===k).reduce((s,o)=>s+quoteTotals(o.quote).grand,0);
  v.innerHTML=pageHead('Quotations','Every quote issued against a dealer order, with acceptance tracking',`<span class="lock">🔒 Price-list templates — licensed version</span>`)+
    `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${kpi('Awaiting dealer',all.filter(o=>st(o)==='Awaiting dealer').length,inrK(val('Awaiting dealer'))+' open','num')}${kpi('Accepted',all.filter(o=>st(o)==='Accepted').length,inrK(val('Accepted'))+' won','num')}${kpi('Acceptance rate',Math.round(all.filter(o=>st(o)==='Accepted').length/Math.max(1,all.filter(o=>st(o)!=='Awaiting dealer').length)*100),'of decided quotes','pct')}${kpi('Expired',all.filter(o=>st(o)==='Expired').length,'past validity — follow up','num')}</div>
    <div class="seg" style="margin:14px 0 12px">${tabs.map(t=>`<button class="${STATE.quoteTab===t?'on':''}" data-qt="${t}">${t==='all'?'All':t} <span class="cnt">${t==='all'?all.length:all.filter(o=>st(o)===t).length}</span></button>`).join('')}</div>
    <div class="card"><div class="t-wrap"><table><thead><tr><th>Quotation</th><th>Order</th><th>Dealer</th><th>Sent</th><th class="r">Lines</th><th class="r">Grand total</th><th>Valid till</th><th>Status</th><th></th></tr></thead><tbody>${list.slice(0,40).map(o=>{const q=o.quote,d=DMAP[o.dealer],s=st(o);return `<tr><td class="mono"><b>${q.id}</b>${q.rev>1?' <span class="chip sm">rev '+q.rev+'</span>':''}</td><td class="mono tiny">${o.id}</td><td>${esc(d.name)}<div class="muted tiny">${esc(d.city)}</div></td><td class="tiny">${q.sentOn?fmtDT(q.sentOn):'—'}</td><td class="r num">${q.lines.length}</td><td class="r num"><b>${inr(quoteTotals(q).grand)}</b></td><td class="tiny">${q.sentOn?fmtD(q.sentOn+q.validity*DAY):'—'}</td><td>${statusChip(s==='Awaiting dealer'?'Quoted':s==='Accepted'?'Confirmed':s==='Expired'?'Cancelled':'Quote Declined').replace(/>[^<]+</,'>'+s+'<')}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-qv="${o.id}">View</button>${s==='Awaiting dealer'||s==='Expired'?(canAcceptOrders()?` <button class="btn ghost sm" data-qr="${o.id}">Revise</button>`:''):''}</td></tr>`;}).join('')||'<tr><td colspan=9 class="empty">No quotations.</td></tr>'}</tbody></table></div></div>`;
  $$('[data-qt]',v).forEach(b=>b.addEventListener('click',()=>{STATE.quoteTab=b.dataset.qt;viewQuotes(v);}));$$('[data-qv]',v).forEach(b=>b.addEventListener('click',()=>quoteView(b.dataset.qv)));$$('[data-qr]',v).forEach(b=>b.addEventListener('click',()=>quoteBuilder(b.dataset.qr)));
}
</script>
<script>
/* ============================================================
   4. DEALS · DISPATCH · LIVE TRACKING · CUSTOMERS · PRODUCTS · REPORTS · USERS · SETTINGS
   ============================================================ */
/* ---------- DEALS PIPELINE ---------- */
function dealStage(o){if(o.status==='Quoted')return (NOW-o.quote.sentOn>o.quote.validity*DAY)?'Negotiation':'Quotation sent';if(o.status==='Confirmed'||o.status==='Packing')return 'Won · at plant';if(o.status==='Dispatched')return 'In delivery';if(o.status==='Delivered')return 'Closed';if(o.status==='Quote Declined')return 'Lost';return null;}
function viewDeals(v){
  const cols=['Quotation sent','Negotiation','Won · at plant','In delivery','Closed','Lost'];const deals=ORDERS.filter(o=>o.quote&&dealStage(o));
  const by={};cols.forEach(c=>by[c]=[]);deals.forEach(o=>by[dealStage(o)].push(o));
  const won=deals.filter(o=>['Won · at plant','In delivery','Closed'].includes(dealStage(o)));const wonVal=won.reduce((s,o)=>s+quoteTotals(o.quote).grand,0);const openVal=deals.filter(o=>['Quotation sent','Negotiation'].includes(dealStage(o))).reduce((s,o)=>s+quoteTotals(o.quote).grand,0);
  const paid=won.filter(o=>o.payment==='Paid').reduce((s,o)=>s+quoteTotals(o.quote).grand,0);
  v.innerHTML=pageHead('Deals pipeline','Every quotation becomes a deal record — value, stage, payment and delivery in one card',`<span class="lock">🔒 Drag-and-drop · forecast — licensed version</span>`)+
    `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${kpi('Open quotes value',openVal,deals.filter(o=>['Quotation sent','Negotiation'].includes(dealStage(o))).length+' deals','inrk')}${kpi('Won (all time)',wonVal,won.length+' deals','inrk')}${kpi('Collected',paid,'of won value','inrk')}${kpi('Win rate',Math.round(won.length/Math.max(1,won.length+by['Lost'].length)*100),'won vs lost','pct')}${kpi('Avg deal size',won.length?wonVal/won.length:0,'per confirmed deal','inr')}</div>
    <div class="kanban" style="margin-top:14px">${cols.map(c=>{const list=by[c].slice().sort((a,b)=>b.placed-a.placed);const tot=list.reduce((s,o)=>s+quoteTotals(o.quote).grand,0);return `<div class="card kcol"><div class="kcol-head"><h4>${c}</h4><span class="chip sm ${c==='Lost'?'crit':c==='Closed'?'good':''}">${list.length} · ${inrK(tot)}</span></div><div class="kcol-body">${list.slice(0,25).map(o=>{const d=DMAP[o.dealer];return `<div class="kcard" data-deal="${o.id}"><div class="kc-title">${esc(d.name)}</div><div class="kc-sub">${o.quote.id} · ${o.id} · ${esc(d.city)}</div><div class="kc-val">${inr(quoteTotals(o.quote).grand)}</div><div class="row" style="gap:6px;margin-top:6px"><span class="chip sm ${o.payment==='Paid'?'good':o.payment==='Pending'?'warn':''}">${esc(o.payment)}</span>${o.shipment?`<span class="chip sm accent">⛟ ${o.shipment}</span>`:''}</div></div>`;}).join('')||'<div class="empty" style="padding:14px">—</div>'}</div></div>`;}).join('')}</div>`;
  $$('[data-deal]',v).forEach(k=>k.addEventListener('click',()=>orderModal(k.dataset.deal)));
}

/* ---------- SHIPMENT / COURIER MODEL ---------- */
function shipETA(s){return s.deliveredAt?'Delivered '+fmtD(s.deliveredAt):fmtD(s.estDelivery);}
function syncOrderWithShip(s){const o=orderById(s.ref);if(!o)return;if(s.deliveredAt)o.status='Delivered';else o.status=s.kind==='dealer'?'Dispatched':'Shipped';}
function shipWho(s){const o=orderById(s.ref);return s.kind==='dealer'?DMAP[o.dealer]:CMAP[o.customer];}
function courierRecord(s,opts){opts=opts||{};const o=orderById(s.ref);const who=shipWho(s);const st=shipStatus(s);const late=st==='Delayed';
  const steps=[{t:'Handed to courier',s:fmtDT(s.dispatchedAt),done:true},{t:'Estimated delivery',s:fmtD(s.estDelivery)+(late?' · past due':''),done:!!s.deliveredAt,cur:!s.deliveredAt},{t:'Delivered',s:s.deliveredAt?fmtDT(s.deliveredAt)+(s.receivedBy?' · received by '+s.receivedBy:''):'awaiting confirmation',done:!!s.deliveredAt}];
  return `<div class="grid" style="grid-template-columns:1.2fr 1fr;gap:14px" id="courierRec">
    <div class="soft" style="padding:14px 16px"><div class="eyebrow" style="margin-bottom:10px">Courier record</div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">${field('Courier partner',s.courier)}<div class="mini"><div class="muted tiny">AWB / docket number</div><div class="row" style="gap:6px;margin-top:2px"><b class="mono" style="font-size:14px">${s.awb}</b><button class="btn ghost xs" data-copyawb="${s.awb}">Copy</button></div></div>${field('Dispatched on',fmtDT(s.dispatchedAt))}${field('Estimated delivery',fmtD(s.estDelivery))}${field('Ship to',(s.kind==='dealer'?who.name:who.name)+' · '+s.dest.name+', '+s.dest.state)}${field('Consignment',s.boxes+' '+(s.kind==='dealer'?'cases':'pcs')+' · '+s.weightKg+' kg')}${s.note?field('Note',s.note):''}</div>
      <div class="muted tiny" style="margin-top:10px">Track on the courier's website with the AWB number. Status sync from the courier API is part of the licensed build.</div></div>
    <div class="stack"><div class="eta-band"><div><div class="eyebrow">${s.deliveredAt?'Delivered':late?'Past estimated date':'Estimated delivery'}</div><div class="eta">${s.deliveredAt?fmtD(s.deliveredAt):fmtD(s.estDelivery)}</div><div class="muted tiny">${esc(s.courier)} · ${s.dest.name}</div></div>${statusChip(st)}</div>
      <div class="soft" style="padding:14px 16px"><div class="tl">${steps.map(x=>`<div class="tl-item ${x.done?'done':x.cur?'cur':''}"><div class="tl-t">${esc(x.t)}</div><div class="tl-s">${esc(x.s)}</div></div>`).join('')}</div></div></div></div>`;}
function bindCourierRecord(s,opts){$$('[data-copyawb]').forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.copyawb,'AWB '+b.dataset.copyawb+' copied')));}
function shipmentModal(id){const s=SHMAP()[id];if(!s)return;const o=orderById(s.ref);const who=shipWho(s);
  openModal(`<div class="spread"><div><div class="eyebrow">${s.kind==='dealer'?'Dealer consignment':'Customer order'} · ${s.id}</div><h2 style="font-size:20px">${esc(s.ref)} · ${esc(who.name)}</h2></div>${statusChip(shipStatus(s))}</div>
    <div style="margin-top:14px">${courierRecord(s)}</div>
    <div class="row" style="margin-top:16px;justify-content:space-between"><div class="row">${!s.deliveredAt&&canDispatch()?`<button class="btn sm" id="sm_edit">Edit courier / AWB / date</button>`:''}</div><div class="row"><button class="btn ghost" onclick="closeModal()">Close</button>${!s.deliveredAt&&canDispatch()?`<button class="btn good" id="sm_deliver">✓ Mark delivered</button>`:''}</div></div>`,true);
  bindCourierRecord(s);const e=$('#sm_edit');if(e)e.addEventListener('click',()=>shipmentForm(s.ref,s));const d=$('#sm_deliver');if(d)d.addEventListener('click',()=>deliveredForm(s));}
function deliveredForm(s){openModal(`<h2 style="font-size:19px">Mark delivered — ${s.id}</h2><div class="muted tiny" style="margin-top:4px">${s.ref} · ${esc(s.courier)} · AWB ${s.awb}</div>
  <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><label class="fld">Delivered on<input id="dv_date" type="date" value="${NOW.toISOString().slice(0,10)}"></label><label class="fld">Received by<input id="dv_by" placeholder="Name of receiver"></label></div>
  <label class="fld" style="margin-top:10px">Note<select id="dv_note"><option>Received in good condition</option><option>Received — 1 case damaged</option><option>Short delivery (noted)</option></select></label>
  <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn good" id="dv_ok">Confirm delivery</button></div>`);
  $('#dv_ok').addEventListener('click',()=>{s.deliveredAt=new Date($('#dv_date').value).getTime()||NOW.getTime();s.receivedBy=$('#dv_by').value.trim()||'Receiver';s.note=$('#dv_note').value;const o=orderById(s.ref);o.status='Delivered';o.history.push({t:NOW.getTime(),label:'Delivered by '+s.courier+' — received by '+s.receivedBy+' · '+s.note,by:STATE.user.name});closeModal();routeView();toast(s.id+' marked delivered','good');const who=shipWho(s);notify(s.kind==='dealer'?who.contact:who.name,'Your order '+o.id+' has been delivered. Thank you!');});}
function shipmentForm(orderId,existing){const o=orderById(orderId);const isC=o.id.startsWith('CO-');const who=isC?CMAP[o.customer]:DMAP[o.dealer];const dest=cityByName(who.city);const days=transitDays(dest,isC?'customer':'dealer');
  const couriers=isC?COURIERS_RETAIL:COURIERS_BULK;const defC=existing?existing.courier:(isC?SETTINGS.courier.customerDefault:SETTINGS.courier.dealerDefault);
  const est=existing?new Date(existing.estDelivery):new Date(NOW.getTime()+days*DAY);
  openModal(`<h2 style="font-size:19px">${existing?'Edit courier details — '+existing.id:'Hand over to courier — '+o.id}</h2><div class="muted tiny" style="margin-top:4px">${esc(who.name)} · ${esc(dest.name)}, ${esc(dest.state)} · usual transit ${days} days</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><label class="fld">Courier partner<select id="sf_cr">${couriers.map(c=>`<option ${c===defC?'selected':''}>${c}</option>`).join('')}<option ${couriers.includes(defC)?'':'selected'}>Other</option></select></label><label class="fld">AWB / docket number<input id="sf_awb" value="${existing?existing.awb:''}" placeholder="From courier receipt"></label><label class="fld">Dispatch date<input id="sf_dt" type="date" value="${new Date(existing?existing.dispatchedAt:NOW).toISOString().slice(0,10)}"></label><label class="fld">Estimated delivery date<input id="sf_est" type="date" value="${est.toISOString().slice(0,10)}"></label><label class="fld">${isC?'Packages':'Cases'}<input id="sf_box" type="number" value="${existing?existing.boxes:o.items.reduce((s,i)=>s+i.qty,0)}"></label><label class="fld">Weight (kg)<input id="sf_wt" type="number" value="${existing?existing.weightKg:Math.round(o.items.reduce((s,i)=>s+i.qty,0)*(isC?1.4:14))}"></label></div>
    <label class="fld" style="margin-top:10px">Note<input id="sf_note" value="${esc(existing?existing.note:'')}" placeholder="Optional — e.g. 2 cartons, fragile"></label>
    <div class="soft" style="padding:10px 12px;margin-top:12px;font-size:12.5px">${esc(isC?who.name:who.contact)} will receive the courier name, AWB number and estimated date on WhatsApp.</div>
    <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="sf_ok">${existing?'Save changes':'Save & mark dispatched →'}</button></div>`);
  $('#sf_ok').addEventListener('click',()=>{const awb=$('#sf_awb').value.trim();if(!awb){toast('Enter the AWB / docket number from the courier receipt','warn');return;}const estD=new Date($('#sf_est').value).getTime();if(!estD){toast('Enter the estimated delivery date','warn');return;}
    const dispatchedAt=new Date($('#sf_dt').value).getTime()||NOW.getTime();
    if(existing){Object.assign(existing,{courier:$('#sf_cr').value,awb,dispatchedAt,estDelivery:estD,boxes:+$('#sf_box').value||existing.boxes,weightKg:+$('#sf_wt').value||existing.weightKg,note:$('#sf_note').value});o.history.push({t:NOW.getTime(),label:'Courier details updated · '+existing.courier+' · AWB '+awb+' · est. '+fmtD(estD),by:STATE.user.name});closeModal();routeView();toast('Courier record updated','good');return;}
    const s=mkShipment(o,dest,dispatchedAt,isC?'customer':'dealer');s.courier=$('#sf_cr').value;s.awb=awb;s.estDelivery=estD;s.boxes=+$('#sf_box').value||s.boxes;s.weightKg=+$('#sf_wt').value||s.weightKg;s.note=$('#sf_note').value;s.by=STATE.user.name;
    SHIPMENTS.push(s);o.shipment=s.id;o.status=isC?'Shipped':'Dispatched';o.history.push({t:NOW.getTime(),label:'Handed to '+s.courier+' · AWB '+awb+' · est. delivery '+fmtD(estD),by:STATE.user.name});closeModal();STATE.dispatchTab='active';STATE.route='dispatch';renderShell();toast(o.id+' dispatched via '+s.courier+' — AWB '+awb,'good');notify(isC?who.name:who.contact,'Order '+o.id+' shipped via '+s.courier+'. AWB '+awb+'. Expected by '+fmtD(estD)+'.');});}

/* ---------- DISPATCH ---------- */
function viewDispatch(v){
  const queueD=ORDERS.filter(o=>['Confirmed','Packing'].includes(o.status));const queueC=CORDERS.filter(o=>['Confirmed','Packed'].includes(o.status));
  const active=SHIPMENTS.filter(s=>!s.deliveredAt).sort((a,b)=>a.estDelivery-b.estDelivery);const done=SHIPMENTS.filter(s=>s.deliveredAt).sort((a,b)=>b.deliveredAt-a.deliveredAt);const late=active.filter(s=>NOW>s.estDelivery);
  const tab=STATE.dispatchTab;
  v.innerHTML=pageHead('Dispatch & courier','Hand confirmed orders to the courier and keep AWB, partner and expected date on record',`<span class="lock">🔒 Courier API status sync · e-way bill — licensed version</span>`)+
    `<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${kpi('Waiting at plant',queueD.length+queueC.length,'confirmed, not yet dispatched','num')}${kpi('With courier',active.length,'awaiting delivery','num')}${kpi('Past estimated date',late.length,'follow up with courier','num')}${kpi('Delivered (30d)',done.filter(s=>s.deliveredAt>NOW-30*DAY).length,'confirmed deliveries','num')}</div>
    <div class="seg" style="margin:14px 0 12px"><button class="${tab==='queue'?'on':''}" data-dt="queue">Dispatch queue <span class="cnt">${queueD.length+queueC.length}</span></button><button class="${tab==='active'?'on':''}" data-dt="active">With courier <span class="cnt">${active.length}</span></button><button class="${tab==='delivered'?'on':''}" data-dt="delivered">Delivered <span class="cnt">${done.length}</span></button></div>

/* ---------- REPORTS ---------- */
const RTYPES={sales:'Sales by dealer',product:'Sales by product',state:'Sales by state',dispatch:'Dispatch performance',outstanding:'Dealer outstanding',customers:'Direct customer sales'};
function csvRow(a){return a.map(x=>{x=String(x==null?'':x);return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x;}).join(',');}
function viewReports(v){
  const r=STATE.rpt;const days=r.period==='week'?7:r.period==='month'?30:r.period==='quarter'?90:365;const from=NOW-days*DAY;
  const os=ORDERS.filter(o=>o.placed>from&&o.status!=='Rejected'&&o.quote);let head=[],rows=[],title=RTYPES[r.type];
  if(r.type==='sales'){const m={};os.forEach(o=>{const d=DMAP[o.dealer];m[d.id]=m[d.id]||{d,n:0,v:0,del:0};m[d.id].n++;m[d.id].v+=quoteTotals(o.quote).grand;if(o.status==='Delivered')m[d.id].del+=quoteTotals(o.quote).grand;});head=['Dealer','City','Tier','Orders','Quoted value','Delivered value'];rows=Object.values(m).sort((a,b)=>b.v-a.v).map(x=>[x.d.name,x.d.city,x.d.tier,x.n,x.v,x.del]);}
  else if(r.type==='product'){const m={};os.forEach(o=>o.quote.lines.forEach(l=>{m[l.pid]=m[l.pid]||{p:PMAP[l.pid],cs:0,v:0};m[l.pid].cs+=l.qty;m[l.pid].v+=l.qty*PMAP[l.pid].upc*l.rate*(1-l.disc/100);}));head=['Product','Pack','Cases','Units','Value (pre-GST)'];rows=Object.values(m).sort((a,b)=>b.v-a.v).map(x=>[x.p.name,x.p.pack,x.cs,x.cs*x.p.upc,Math.round(x.v)]);}
  else if(r.type==='state'){const m={};os.forEach(o=>{const s=DMAP[o.dealer].state;m[s]=m[s]||{n:0,v:0,d:new Set()};m[s].n++;m[s].v+=quoteTotals(o.quote).grand;m[s].d.add(o.dealer);});head=['State','Dealers ordering','Orders','Value'];rows=Object.entries(m).sort((a,b)=>b[1].v-a[1].v).map(x=>[x[0],x[1].d.size,x[1].n,x[1].v]);}
  else if(r.type==='dispatch'){const ss=SHIPMENTS.filter(s=>s.dispatchedAt>from);head=['Shipment','Order','Destination','Courier','AWB','Dispatched','Est. delivery','Delivered','Received by','Status'];rows=ss.map(s=>[s.id,s.ref,s.dest.name,s.courier,s.awb,fmtD(s.dispatchedAt),fmtD(s.estDelivery),s.deliveredAt?fmtD(s.deliveredAt):'',s.receivedBy||'',shipStatus(s)]);}
  else if(r.type==='outstanding'){head=['Dealer','City','Terms','Credit limit','Outstanding','Utilisation %'];rows=DEALERS.filter(d=>d.outstanding>0).sort((a,b)=>b.outstanding-a.outstanding).map(d=>[d.name,d.city,d.terms,d.credit,d.outstanding,Math.round(d.outstanding/d.credit*100)]);}
  else{const cs=CORDERS.filter(o=>o.placed>from);head=['Order','Customer','City','Placed','Payment','Status','Total'];rows=cs.map(o=>[o.id,CMAP[o.customer].name,CMAP[o.customer].city,fmtD(o.placed),o.payment,o.status,o.total]);}
  const money=(h)=>/value|limit|outstanding|total/i.test(h);const total=head.map((h,i)=>money(h)?rows.reduce((s,x)=>s+(+x[i]||0),0):null);
  const csv=[csvRow(['Chehar CRM — '+title,'Period: last '+days+' days','Generated '+fmtDT(NOW.getTime())]),csvRow(head)].concat(rows.map(csvRow)).join('\n');
  v.innerHTML=pageHead('Reports','Records for the owner and accounts team · '+title+' · last '+days+' days',`<span class="lock">🔒 PDF · scheduled email — licensed version</span>`)+
    `<div class="toolbar card" style="padding:12px 14px"><label class="fld">Report<select id="rp_type">${Object.keys(RTYPES).map(k=>`<option value="${k}" ${r.type===k?'selected':''}>${RTYPES[k]}</option>`).join('')}</select></label><label class="fld">Period<select id="rp_per">${[['week','Last 7 days'],['month','Last 30 days'],['quarter','Last 90 days'],['year','Last 12 months']].map(p=>`<option value="${p[0]}" ${r.period===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select></label><div style="flex:1"></div><button class="btn primary" id="rp_copy" style="align-self:flex-end">Copy as CSV</button></div>
    <div class="card"><div class="panel-head"><h3>${title}</h3><span class="chip accent">${rows.length} rows</span></div><div class="t-wrap"><table><thead><tr>${head.map((h,i)=>`<th class="${money(h)||/orders|cases|units|km|%/i.test(h)?'r':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,60).map(x=>`<tr>${x.map((c,i)=>`<td class="${money(head[i])?'r num':typeof c==='number'?'r num':''}">${money(head[i])?inr(c):esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="9" class="empty">No data for this period.</td></tr>'}</tbody>${total.some(t=>t!==null)?`<tfoot><tr>${total.map((t,i)=>`<td class="${t!==null?'r num strong':'strong'}" style="border-top:2px solid var(--line-2)">${i===0?'Total':t!==null?inr(t):''}</td>`).join('')}</tr></tfoot>`:''}</table></div>${rows.length>60?`<div class="pager" style="padding:10px 14px">Showing 60 of ${rows.length} — full list in CSV</div>`:''}</div>`;
  $('#rp_type').addEventListener('change',e=>{r.type=e.target.value;viewReports(v);});$('#rp_per').addEventListener('change',e=>{r.period=e.target.value;viewReports(v);});$('#rp_copy').addEventListener('click',()=>copyText(csv,'Report copied as CSV'));
}

      <div class="card" style="padding:16px"><div class="eyebrow">Access model</div><p class="muted tiny" style="margin:8px 0 0;line-height:1.7"><b style="color:var(--fg-dim)">Owner</b> — everything.<br><b style="color:var(--fg-dim)">Sales Manager</b> — the authorised person who accepts dealer orders and issues quotations.<br><b style="color:var(--fg-dim)">Dispatch Manager</b> — courier hand-over, AWB, delivery confirmation.<br><b style="color:var(--fg-dim)">Dealer</b> — own orders, plus full control of its dukandars (accounts and shop orders).<br><b style="color:var(--fg-dim)">Dukandar</b> — orders from its own dealer only; login managed by that dealer.<br><b style="color:var(--fg-dim)">Customer</b> — own data only.</p></div></div></div>`;
  $$('[data-eu]',v).forEach(b=>b.addEventListener('click',()=>userForm(+b.dataset.eu)));$('#addUser').addEventListener('click',()=>userForm(null));
}
function userForm(i){const u=i===null?{role:'SALES',username:'',password:'',name:''}:USERS[i];
  openModal(`<h2 style="font-size:19px">${i===null?'Add staff login':'Edit user'}</h2><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><label class="fld">Display name<input id="us_name" value="${esc(u.name)}"></label><label class="fld">Role<select id="us_role">${['OWNER','SALES','DISPATCH'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLES[r].title}</option>`).join('')}</select></label><label class="fld">Login ID<input id="us_user" value="${esc(u.username)}"></label></div><input id="us_pass" type="hidden" value="${esc(u.password||'x')}"><div class="muted tiny" id="us_warn" style="margin-top:8px"></div>
    <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="us_save">Save</button></div>`);
  $('#us_save').addEventListener('click',()=>{const name=$('#us_name').value.trim(),user=$('#us_user').value.trim(),pass=$('#us_pass').value;if(!name||!user||!pass){$('#us_warn').innerHTML='<span style="color:var(--crit)">All fields are required.</span>';return;}if(USERS.some((x,j)=>j!==i&&x.username.toLowerCase()===user.toLowerCase())){$('#us_warn').innerHTML='<span style="color:var(--crit)">Username already taken.</span>';return;}
    if(i===null)USERS.push({role:$('#us_role').value,username:user,password:pass,name,link:null});else Object.assign(u,{name,username:user,password:pass,role:$('#us_role').value});closeModal();viewUsers($('#view'));toast('User saved','good');});}

/* ---------- SETTINGS ---------- */
function viewSettings(v){const S=SETTINGS;
  v.innerHTML=pageHead('Settings','Company profile, pricing rules, courier defaults and notifications',`<span class="chip accent">Owner</span>`)+
    `<div class="two"><div class="card"><div class="panel-head"><h3>Company profile</h3></div><div class="panel-body grid">${field('Legal name',COMPANY.name)}${field('GSTIN',COMPANY.gstin)}${field('Plant / hub',COMPANY.addr)}${field('Phone · email',COMPANY.phone+' · '+COMPANY.email)}<span class="lock" style="align-self:flex-start">🔒 Logo & letterhead upload — licensed</span></div></div>

      <div class="card"><div class="panel-head"><h3>Freight & courier</h3></div><div class="panel-body grid" style="grid-template-columns:1fr 1fr"><label class="fld">Free freight within<select data-s="freightFreeState"><option ${S.freightFreeState==='Gujarat'?'selected':''}>Gujarat</option><option ${S.freightFreeState==='None'?'selected':''}>None</option></select></label><label class="fld">Freight ₹ / km (outside)<input type="number" step="0.1" data-s="freightPerKm" value="${S.freightPerKm}"></label><label class="fld">Default courier — dealers<select data-c="dealerDefault">${COURIERS_BULK.map(c=>`<option ${S.courier.dealerDefault===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="fld">Default courier — customers<select data-c="customerDefault">${COURIERS_RETAIL.map(c=>`<option ${S.courier.customerDefault===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="fld">Usual transit — Gujarat (days)<input type="number" data-td="gujarat" value="${SETTINGS_TRANSIT.gujarat}"></label><label class="fld">Usual transit — other states (days)<input type="number" data-td="other" value="${SETTINGS_TRANSIT.other}"></label><div class="muted tiny" style="grid-column:1/-1">Transit days pre-fill the estimated delivery date when an order is handed to the courier; dispatch can change it per shipment.</div></div></div>
      <div class="card"><div class="panel-head"><h3>Notifications</h3></div><div class="panel-body grid" style="grid-template-columns:1fr 1fr 1fr"><label class="fld">WhatsApp<select data-n="whatsapp"><option value="1" ${S.notify.whatsapp?'selected':''}>On</option><option value="0" ${S.notify.whatsapp?'':'selected'}>Off</option></select></label><label class="fld">SMS (DLT)<select data-n="sms"><option value="1" ${S.notify.sms?'selected':''}>On</option><option value="0" ${S.notify.sms?'':'selected'}>Off</option></select></label><label class="fld">Email<select data-n="email"><option value="1" ${S.notify.email?'selected':''}>On</option><option value="0" ${S.notify.email?'':'selected'}>Off</option></select></label><div class="muted tiny" style="grid-column:1/-1">Dealers and customers are notified on: order accepted, quotation sent, handed to courier (with AWB & expected date), delivered. Templates are DLT-approved in the licensed build.</div></div></div></div>

  $('#saveSet').addEventListener('click',()=>{$$('[data-s]',v).forEach(i=>{S[i.dataset.s]=i.type==='number'?+i.value:i.value;});$$('[data-t]',v).forEach(i=>{S.tiers[i.dataset.t]=+i.value;});$$('[data-c]',v).forEach(i=>{S.courier[i.dataset.c]=i.value;});$$('[data-td]',v).forEach(i=>{SETTINGS_TRANSIT[i.dataset.td]=+i.value||1;});$$('[data-n]',v).forEach(i=>{S.notify[i.dataset.n]=i.value==='1';});DEALERS.forEach(d=>d.disc=S.tiers[d.tier]);viewSettings(v);toast('Settings saved (session only)','good');});
}
</script>
<script>
/* ============================================================
   7. DUKANDAR LAYER — shops under each dealer
   Dealer creates & manages dukandar logins; dukandars order from
   their dealer; dealer handles those orders (accept → pack → deliver).
   Unlimited dealers, unlimited dukandars per dealer.
   ============================================================ */
const SHOP_WORDS=['Provision Store','Kirana Store','General Store','Super Market','Mart','Stores','Kirana','Departmental Store','Grocery','Traders'];
const AREAS=['Station Road','Main Bazar','Gandhi Chowk','Nehru Nagar','Ring Road','Mavdi Chowk','Kalawad Road','University Road','Bus Stand Road','Old City','Market Yard','GIDC Road','Shivaji Chowk','Mahavir Nagar','Sardar Chowk'];
const DUKANDARS=[];const DORDERS=[];let kSeq=1,koSeq=7100;
const dukPrice=(p)=>Math.round(p.mrp*0.86);           // dealer → dukandar rate (14% below MRP; dealer edits per shop in licensed build)
const slug=(s)=>s.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,18);
function mkDukandar(dealerId,overrides){const d=DMAP[dealerId];const owner=pname();const shop=pick(PERSON_L)+' '+pick(SHOP_WORDS);
  const k=Object.assign({id:'K'+String(kSeq++).padStart(4,'0'),dealer:dealerId,shop,owner,area:pick(AREAS),city:d.city,phone:phone(),username:slug(shop)+randint(10,99),password:'Shop@'+randint(1000,9999),active:rnd()>0.05,
    since:new Date(2023+randint(0,3),randint(0,11),randint(1,28)).toISOString().slice(0,10),credit:randint(1,8)*10000,outstanding:0,orders:0,spent:0,lastOrder:null,created:'Dealer'},overrides||{});
  if(k.outstanding===0&&rnd()<0.45)k.outstanding=randint(1,9)*1000;return k;}
(function(){
  // demo dealer D001 gets 6 named shops; every other active dealer gets 0–7 (unlimited in licensed build)
  const demo=[['Patel Provision Store','Mukesh Patel','Kalawad Road'],['Jay Ambe Kirana','Hetal Solanki','Mavdi Chowk'],['Shivam General Store','Kishan Rathod','University Road'],['Maruti Super Market','Sagar Mehta','Ring Road'],['Krishna Mart','Nita Joshi','Gandhi Chowk'],['Umiya Stores','Alpesh Vora','Station Road']];
  demo.forEach((x,i)=>DUKANDARS.push(mkDukandar('D001',{shop:x[0],owner:x[1],area:x[2],username:slug(x[0]),password:'Shop@'+(2201+i),active:true})));
  DEALERS.filter(d=>d.active&&d.id!=='D001').forEach(d=>{const n=randint(0,7);for(let i=0;i<n;i++)DUKANDARS.push(mkDukandar(d.id));});
  // orders: dukandar → dealer (units, not cases)
  const KST=['Placed','Accepted','Packed','Delivered'];
  const all=DUKANDARS.filter(k=>k.active);
  for(let i=0;i<420;i++){const k=i<8?DUKANDARS[i%6]:pick(all);const ageDays=i<8?[0.1,0.4,1,2,4,7,12,20][i]:rnd()*45;const placed=NOW-ageDays*DAY;
    const n=randint(1,5);const ids=new Set();while(ids.size<n)ids.add(pick(PRODUCTS).id);const items=[...ids].map(pid=>({pid,qty:randint(2,24)}));
    const total=items.reduce((s,it)=>s+dukPrice(PMAP[it.pid])*it.qty,0);
    const r=rnd();const S=i<8?['Placed','Placed','Accepted','Packed','Delivered','Delivered','Rejected','Delivered'][i]:ageDays<1?(r<0.6?'Placed':'Accepted'):ageDays<3?(r<0.15?'Placed':r<0.35?'Accepted':r<0.55?'Packed':'Delivered'):(r<0.04?'Rejected':'Delivered');
    const o={id:'SO-'+(koSeq++),dukandar:k.id,dealer:k.dealer,placed,items,total,status:S,payment:rnd()<0.6?'Cash on delivery':'Credit',note:pick(['','','','Need by evening','Send with next van','Urgent — stock out']),history:[{t:placed,label:'Order placed by dukandar',by:k.owner}]};
    let t=placed;const idx=KST.indexOf(S);const dn=DMAP[k.dealer].contact;
    if(S==='Rejected'){o.history.push({t:t+3600000*2,label:'Order declined by dealer — '+pick(['item out of stock','outstanding pending','duplicate order']),by:dn});}
    if(idx>=1){t+=3600000*randint(1,6);o.history.push({t,label:'Order accepted by dealer',by:dn});}
    if(idx>=2){t+=3600000*randint(1,8);o.history.push({t,label:'Packed at dealer godown',by:dn});}
    if(idx>=3){t+=3600000*randint(2,24);o.deliveredAt=Math.min(t,NOW.getTime()-600000);o.history.push({t:o.deliveredAt,label:'Delivered to shop · received by '+k.owner,by:dn});if(o.payment==='Cash on delivery')o.payment='Paid (cash)';}
    DORDERS.push(o);k.orders++;if(S==='Delivered')k.spent+=total;k.lastOrder=k.lastOrder?Math.max(k.lastOrder,placed):placed;}
  DORDERS.sort((a,b)=>b.placed-a.placed);
})();
const KMAP=()=>Object.fromEntries(DUKANDARS.map(k=>[k.id,k]));
const KSTAGES=['Placed','Accepted','Packed','Delivered'];
const myDukandar=()=>KMAP()[STATE.user.link];
const dukOf=(dealerId)=>DUKANDARS.filter(k=>k.dealer===dealerId);
ROLES.DUKANDAR={id:'DUKANDAR',title:'Dukandar (Shop)',ico:'▫',portal:'dukandar',desc:'Orders from their dealer; login created and managed by the dealer'};
USERS.push({role:'DUKANDAR',username:'dukandar',password:'Shop@2201',name:'Mukesh Patel',link:'K0001'});
PALETTES.dukandar={light:['#7c3aed','#5b21b6','#efe9fd'],dark:['#a78bfa','#8b5cf6','#2a2145']};
STATE.kRoute='shop';STATE.kcart={};STATE.dukTab='Placed';STATE.dukQ='';STATE.dukView='orders';
function kStatusChip(s){return statusChip(s);}
function dukItemsTable(items){return `<div class="t-wrap"><table><thead><tr><th>Product</th><th>Pack</th><th class="r">Units</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>${items.map(it=>{const p=PMAP[it.pid];return `<tr><td>${esc(p.name)}</td><td class="tiny muted">${esc(p.pack)}</td><td class="r num">${it.qty}</td><td class="r num">${inr(dukPrice(p))}</td><td class="r num">${inr(dukPrice(p)*it.qty)}</td></tr>`;}).join('')}</tbody></table></div>`;}

/* ---------- DEALER SIDE: manage dukandars ---------- */
function dDukandars(v){const d=myDealer();const ks=dukOf(d.id);const q=STATE.dukQ.toLowerCase();let list=ks.slice();if(q)list=list.filter(k=>k.shop.toLowerCase().includes(q)||k.owner.toLowerCase().includes(q)||k.area.toLowerCase().includes(q)||k.username.toLowerCase().includes(q));
  list.sort((a,b)=>(b.lastOrder||0)-(a.lastOrder||0));
  const pending=DORDERS.filter(o=>o.dealer===d.id&&o.status==='Placed').length;const month=DORDERS.filter(o=>o.dealer===d.id&&o.placed>NOW-30*DAY&&o.status!=='Rejected');
  v.innerHTML=`<div class="page-head spread"><div><div class="eyebrow">${esc(d.name)} · dealer network</div><h1>My dukandars</h1><div class="muted tiny" style="margin-top:3px">Shops that buy from you. You create their login, they order from their phone, you handle the order. No limit on the number of shops.</div></div><div class="row"><button class="btn" data-go="dukorders">Dukandar orders${pending?` <span class="ni-badge">${pending}</span>`:''}</button><button class="btn primary" id="addDuk">+ Add dukandar</button></div></div>
    <div class="kpis">${kpi('Dukandars',ks.length,ks.filter(k=>k.active).length+' active','num')}${kpi('Orders this month',month.length,inrK(month.reduce((s,o)=>s+o.total,0))+' value','num','dukorders')}${kpi('Pending to accept',pending,'new shop orders','num','dukorders')}${kpi('Shop outstanding',ks.reduce((s,k)=>s+k.outstanding,0),'receivable from shops','inr')}</div>
    <div class="toolbar card" style="padding:12px 14px;margin-top:14px"><input id="kq" placeholder="Search shop, owner, area, login ID…" value="${esc(STATE.dukQ)}" style="min-width:240px"><div style="flex:1"></div><span class="chip accent">${list.length} shown</span></div>
    <div class="card"><div class="t-wrap"><table><thead><tr><th>Shop</th><th>Owner</th><th>Area</th><th>Login ID</th><th>Password</th><th class="r">Orders</th><th class="r">Purchases</th><th class="r">Outstanding</th><th>Last order</th><th></th></tr></thead><tbody>
      ${list.map(k=>`<tr><td><b>${esc(k.shop)}</b> ${k.active?'':'<span class="chip crit sm">disabled</span>'}<div class="muted tiny mono">${k.id} · since ${k.since}</div></td><td class="tiny">${esc(k.owner)}<div class="muted mono">${k.phone}</div></td><td class="tiny">${esc(k.area)}<div class="muted">${esc(k.city)}</div></td><td><span class="mono">${esc(k.username)}</span> <button class="btn ghost xs" data-copy="${esc(k.username)}">Copy</button></td><td><span class="mono">${esc(k.password)}</span> <button class="btn ghost xs" data-copy="${esc(k.password)}">Copy</button></td><td class="r num">${k.orders}</td><td class="r num">${inr(k.spent)}</td><td class="r num" style="${k.outstanding?'color:var(--crit);font-weight:700':''}">${k.outstanding?inr(k.outstanding):'–'}</td><td class="tiny">${k.lastOrder?fmtD(k.lastOrder):'—'}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-kview="${k.id}">Open</button> <button class="btn ghost sm" data-kedit="${k.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan=10 class="empty">No dukandars yet — add your first shop.</td></tr>'}</tbody></table></div></div>`;
  $('#kq').addEventListener('input',e=>{STATE.dukQ=e.target.value;const p=e.target.selectionStart;dDukandars(v);const s=$('#kq');s.focus();s.setSelectionRange(p,p);});
  $('#addDuk').addEventListener('click',()=>dukForm(null));$$('[data-go]',v).forEach(b=>b.addEventListener('click',()=>{STATE.dRoute=b.dataset.go;renderDealer();}));
  $$('[data-copy]',v).forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.copy,'Copied')));$$('[data-kview]',v).forEach(b=>b.addEventListener('click',()=>dukModal(b.dataset.kview)));$$('[data-kedit]',v).forEach(b=>b.addEventListener('click',()=>dukForm(KMAP()[b.dataset.kedit])));}
function dukForm(k){const d=myDealer();const isNew=!k;const pre=k||{};const genPass=()=>'Shop@'+randint(1000,9999);
  openModal(`<h2 style="font-size:19px">${isNew?'Add dukandar':'Edit dukandar — '+esc(pre.shop)}</h2><div class="muted tiny" style="margin-top:4px">${isNew?'Creates the shop record and its portal login under '+esc(d.name)+'. Share the login ID and password with the shop on WhatsApp.':"You manage this shop's login — change the password any time and share it again."}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:16px"><label class="fld">Shop name<input id="kf_shop" value="${esc(pre.shop||'')}" placeholder="e.g. Patel Provision Store"></label><label class="fld">Owner name<input id="kf_owner" value="${esc(pre.owner||'')}"></label><label class="fld">Phone / WhatsApp<input id="kf_phone" value="${esc(pre.phone||'')}" placeholder="+91 …"></label><label class="fld">Area / locality<input id="kf_area" value="${esc(pre.area||'')}" placeholder="e.g. Kalawad Road"></label>
      <label class="fld">Credit limit (₹)<input id="kf_credit" type="number" value="${pre.credit||20000}"></label>${isNew?'':`<label class="fld">Status<select id="kf_active"><option value="1" ${pre.active?'selected':''}>Active</option><option value="0" ${pre.active?'':'selected'}>Disabled (cannot log in)</option></select></label>`}</div>
    <div class="soft" style="padding:12px;margin-top:14px"><div class="eyebrow" style="margin-bottom:8px">Portal login (managed by you)</div><div class="grid" style="grid-template-columns:1fr 1fr"><label class="fld">Login ID<input id="kf_user" value="${esc(pre.username||'')}" placeholder="auto from shop name"></label><label class="fld">Password<div class="row" style="gap:6px;flex-wrap:nowrap"><input id="kf_pass" value="${esc(pre.password||genPass())}"><button class="btn sm" id="kf_gen" type="button">↻ New</button></div></label></div></div>
    <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="kf_save">${isNew?'Create shop + login':'Save changes'}</button></div>`);
  $('#kf_gen').addEventListener('click',()=>{$('#kf_pass').value=genPass();});
  $('#kf_shop').addEventListener('input',e=>{if(isNew)$('#kf_user').value=slug(e.target.value);});
  $('#kf_save').addEventListener('click',()=>{const shop=$('#kf_shop').value.trim();if(!shop){toast('Enter the shop name','warn');return;}const username=($('#kf_user').value.trim()||slug(shop)).toLowerCase();
    if(DUKANDARS.some(x=>x.username===username&&x!==k)){toast('Login ID already used — choose another','warn');return;}
    if(isNew){const nk=mkDukandar(d.id,{shop,owner:$('#kf_owner').value||'—',phone:$('#kf_phone').value||'—',area:$('#kf_area').value||'—',credit:+$('#kf_credit').value||0,outstanding:0,orders:0,spent:0,lastOrder:null,username,password:$('#kf_pass').value||genPass(),active:true,since:NOW.toISOString().slice(0,10)});DUKANDARS.push(nk);closeModal();STATE.dukQ='';renderDealer();toast(nk.shop+' added · login '+nk.username+' / '+nk.password,'good');notify(nk.owner,'Your Chehar shop login: '+nk.username+' / '+nk.password+' (from '+d.name+')');return;}
    Object.assign(k,{shop,owner:$('#kf_owner').value,phone:$('#kf_phone').value,area:$('#kf_area').value,credit:+$('#kf_credit').value||k.credit,username,password:$('#kf_pass').value||k.password,active:$('#kf_active').value==='1'});closeModal();renderDealer();toast('Dukandar updated','good');});}
function dukModal(id){const k=KMAP()[id];const os=DORDERS.filter(o=>o.dukandar===id).slice(0,8);
  openModal(`<div class="spread"><div><div class="eyebrow">${k.id} · ${esc(k.area)}, ${esc(k.city)}</div><h2 style="font-size:20px">${esc(k.shop)}</h2></div>${k.active?'<span class="chip good">Active</span>':'<span class="chip crit">Disabled</span>'}</div>
    <div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:14px">${field('Owner',k.owner)}${field('Phone',k.phone)}${field('Shop since',k.since)}${field('Login ID',k.username)}${field('Password',k.password)}${field('Credit limit',inr(k.credit))}${field('Outstanding',k.outstanding?inr(k.outstanding):'Nil')}${field('Orders',k.orders)}${field('Purchases',inr(k.spent))}</div>

/* ---------- DEALER SIDE: dukandar orders inbox ---------- */
function dDukOrders(v){const d=myDealer();const tabs=[['Placed','New'],['Accepted','Accepted'],['Packed','Packed'],['Delivered','Delivered'],['Rejected','Declined'],['all','All']];
  let list=DORDERS.filter(o=>o.dealer===d.id);const t=STATE.dukTab;if(t!=='all')list=list.filter(o=>o.status===t);const cnt=(k)=>k==='all'?DORDERS.filter(o=>o.dealer===d.id).length:DORDERS.filter(o=>o.dealer===d.id&&o.status===k).length;const km=KMAP();

      ${list.slice(0,40).map(o=>{const k=km[o.dukandar];const age=(NOW-o.placed)/3600000;return `<tr><td class="mono">${o.id}${o.note?'<div class="tiny" style="color:var(--warn)">✎ '+esc(o.note)+'</div>':''}</td><td><b>${esc(k.shop)}</b><div class="muted tiny">${esc(k.owner)} · ${esc(k.area)}</div></td><td class="tiny">${fmtDT(o.placed)}<div class="muted">${age<24?Math.round(age)+' h ago':Math.round(age/24)+' d ago'}</div></td><td class="tiny">${o.items.length} lines · ${o.items.reduce((s,i)=>s+i.qty,0)} units</td><td class="r num">${inr(o.total)}</td><td class="tiny">${esc(o.payment)}</td><td>${statusChip(o.status)}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-ko="${o.id}">Open</button>${o.status==='Placed'?` <button class="btn primary sm" data-kacc="${o.id}">Accept</button>`:''}${o.status==='Accepted'?` <button class="btn primary sm" data-kpack="${o.id}">Packed</button>`:''}${o.status==='Packed'?` <button class="btn good sm" data-kdel="${o.id}">Delivered</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan=8 class="empty">Nothing here.</td></tr>'}</tbody></table></div>${list.length>40?`<div class="pager" style="padding:10px 14px">Showing 40 of ${list.length}</div>`:''}</div>`;

  $$('[data-ko]',v).forEach(b=>b.addEventListener('click',()=>dukOrderModal(b.dataset.ko)));$$('[data-kacc]',v).forEach(b=>b.addEventListener('click',()=>dukAdvance(b.dataset.kacc,'Accepted')));$$('[data-kpack]',v).forEach(b=>b.addEventListener('click',()=>dukAdvance(b.dataset.kpack,'Packed')));$$('[data-kdel]',v).forEach(b=>b.addEventListener('click',()=>dukAdvance(b.dataset.kdel,'Delivered')));}
function dukAdvance(id,to){const o=DORDERS.find(x=>x.id===id);const k=KMAP()[o.dukandar];const by=STATE.user.name;const label={Accepted:'Order accepted by dealer',Packed:'Packed at dealer godown',Delivered:'Delivered to shop · received by '+k.owner}[to];
  o.status=to;o.history.push({t:NOW.getTime(),label,by});if(to==='Delivered'){o.deliveredAt=NOW.getTime();k.spent+=o.total;if(o.payment==='Cash on delivery')o.payment='Paid (cash)';else k.outstanding+=o.total;}
  closeModal();if(STATE.role==='DEALER')renderDealer();toast(o.id+' → '+to,'good');notify(k.owner,'Order '+o.id+': '+to);}
function dukOrderModal(id){const o=DORDERS.find(x=>x.id===id);const k=KMAP()[o.dukandar];const d=DMAP[o.dealer];const isDealer=STATE.role==='DEALER';const term=o.status==='Rejected';

    <div class="card cart-dock" style="padding:12px 14px;margin:14px 0"><div class="spread"><div class="row"><span class="chip accent">${lines.length} products · ${units} units</span><b>${inr(total)}</b><span class="muted tiny">at your dealer rate</span></div><div class="row"><button class="btn ghost sm" id="kclear" ${lines.length?'':'disabled'}>Clear</button><button class="btn primary" id="kcheckout" ${lines.length?'':'disabled'}>Review & send to dealer →</button></div></div>${lines.length?`<div class="row" style="margin-top:10px;gap:6px">${lines.map(x=>`<span class="pill">${esc(PMAP[x[0]].name.replace('Chehar ',''))} ${esc(PMAP[x[0]].pack)} × ${x[1]}</span>`).join('')}</div>`:''}</div>
    <div class="toolbar"><input id="pq" placeholder="Search products…" value="${esc(STATE.prodQ)}" style="min-width:200px"><div class="seg"><button class="${STATE.prodCat==='all'?'on':''}" data-pc="all">All</button>${CATS.map((c,i)=>`<button class="${STATE.prodCat==String(i)?'on':''}" data-pc="${i}">${c}</button>`).join('')}</div></div>
    <div class="cat-grid">${list.map(p=>{const qn=STATE.kcart[p.id]||0;return `<div class="card pcard">${productArt(p)}<div class="p-name">${esc(p.name)}</div><div class="p-meta">${esc(p.pack)} · MRP ${inr(p.mrp)}</div><div class="spread"><div><div class="p-price">${inr(dukPrice(p))}<span class="muted tiny"> /unit</span></div><div class="muted tiny">margin ${inr(p.mrp-dukPrice(p))} per unit</div></div>${qn?`<div class="qty"><button data-dec="${p.id}">−</button><input type="number" min="0" value="${qn}" data-q="${p.id}"><button data-inc="${p.id}">+</button></div>`:`<button class="btn primary sm" data-inc="${p.id}">Add</button>`}</div></div>`;}).join('')}</div>`;
  const reb=()=>kShop(v);$('#pq').addEventListener('input',e=>{STATE.prodQ=e.target.value;const pos=e.target.selectionStart;reb();const s=$('#pq');s.focus();s.setSelectionRange(pos,pos);});$$('[data-pc]',v).forEach(b=>b.addEventListener('click',()=>{STATE.prodCat=b.dataset.pc;reb();}));$$('[data-go]',v).forEach(b=>b.addEventListener('click',()=>{STATE.kRoute=b.dataset.go;renderDukandar();}));

  $$('[data-q]',v).forEach(i=>i.addEventListener('change',()=>{const n=Math.max(0,+i.value||0);if(n)STATE.kcart[i.dataset.q]=n;else delete STATE.kcart[i.dataset.q];reb();}));$('#kclear').addEventListener('click',()=>{STATE.kcart={};reb();});

      <div class="spread" style="margin-top:12px;font-family:var(--font-display);font-size:18px"><span>Total</span><span style="color:var(--accent-deep)">${inr(total)}</span></div>

      const o={id:'SO-'+(koSeq++),dukandar:k.id,dealer:k.dealer,placed:NOW.getTime(),items,total,status:'Placed',payment:$('#ko_pay').value,note:$('#ko_note').value||'',history:[{t:NOW.getTime(),label:'Order placed by dukandar',by:k.owner}]};DORDERS.unshift(o);k.orders++;k.lastOrder=NOW.getTime();STATE.kcart={};closeModal();STATE.kRoute='orders';renderDukandar();toast('Order '+o.id+' sent to '+d.name,'good');notify(d.contact,'New shop order '+o.id+' from '+k.shop+' · '+inr(total));});});}

<script>

  const lines=Object.entries(STATE.ccart).filter(x=>x[1]>0);const total=lines.reduce((s,x)=>s+PMAP[x[0]].sale*x[1],0);const live=CORDERS.filter(o=>o.customer===c.id&&o.shipment&&!SHMAP()[o.shipment].deliveredAt);
  v.innerHTML=`<div class="hero-band"><div><div class="eyebrow">chehardetergent.com · deliver to ${esc(c.city)}</div><h2>Hi ${esc(c.name.split(' ')[0])}, fresh stock is in.</h2><div class="muted tiny" style="margin-top:4px">${live.length?live.length+' order'+(live.length>1?'s':'')+' on the way — see courier & AWB in Deliveries':'Free delivery in Gujarat on orders above ₹499'}</div></div><div class="row">${live.length?`<button class="btn primary" data-go="track">My deliveries →</button>`:''}<button class="btn" data-go="orders">My orders</button></div></div>
    <div class="card cart-dock" style="padding:12px 14px;margin:14px 0"><div class="spread"><div class="row"><span class="chip accent">${lines.reduce((s,x)=>s+x[1],0)} items</span><b>${inr(total)}</b><span class="muted tiny">${total&&total<499&&c.state==='Gujarat'?'add '+inr(499-total)+' for free delivery':''}</span></div><div class="row"><button class="btn ghost sm" id="cclear" ${lines.length?'':'disabled'}>Clear</button><button class="btn primary" id="ccheckout" ${lines.length?'':'disabled'}>Checkout →</button></div></div></div>
    <div class="toolbar"><input id="pq" placeholder="Search products…" value="${esc(STATE.prodQ)}" style="min-width:200px"><div class="seg"><button class="${STATE.prodCat==='all'?'on':''}" data-pc="all">All</button>${CATS.map((cc,i)=>`<button class="${STATE.prodCat==String(i)?'on':''}" data-pc="${i}">${cc}</button>`).join('')}</div></div>
    <div class="cat-grid">${list.map(p=>{const qn=STATE.ccart[p.id]||0;const off=Math.round((1-p.sale/p.mrp)*100);return `<div class="card pcard">${productArt(p)}${off>=15?`<span class="chip good sm" style="position:absolute;top:18px;left:18px">-${off}%</span>`:''}<div class="p-name">${esc(p.name)}</div><div class="p-meta">${esc(p.pack)}</div><div class="spread"><div><div class="p-price">${inr(p.sale)}</div><div class="muted tiny"><s>${inr(p.mrp)}</s> MRP</div></div>${qn?`<div class="qty"><button data-dec="${p.id}">−</button><input type="number" min="0" value="${qn}" data-q="${p.id}"><button data-inc="${p.id}">+</button></div>`:`<button class="btn primary sm" data-inc="${p.id}">Add</button>`}</div></div>`;}).join('')}</div>`;
  const reb=()=>cShop(v);$('#pq').addEventListener('input',e=>{STATE.prodQ=e.target.value;const pos=e.target.selectionStart;reb();const s=$('#pq');s.focus();s.setSelectionRange(pos,pos);});$$('[data-pc]',v).forEach(b=>b.addEventListener('click',()=>{STATE.prodCat=b.dataset.pc;reb();}));$$('[data-go]',v).forEach(b=>b.addEventListener('click',()=>{STATE.cRoute=b.dataset.go;renderCustomer();}));
  $$('[data-inc]',v).forEach(b=>b.addEventListener('click',()=>{STATE.ccart[b.dataset.inc]=(STATE.ccart[b.dataset.inc]||0)+1;reb();}));$$('[data-dec]',v).forEach(b=>b.addEventListener('click',()=>{STATE.ccart[b.dataset.dec]=Math.max(0,(STATE.ccart[b.dataset.dec]||0)-1);if(!STATE.ccart[b.dataset.dec])delete STATE.ccart[b.dataset.dec];reb();}));
  $$('[data-q]',v).forEach(i=>i.addEventListener('change',()=>{const n=Math.max(0,+i.value||0);if(n)STATE.ccart[i.dataset.q]=n;else delete STATE.ccart[i.dataset.q];reb();}));$('#cclear').addEventListener('click',()=>{STATE.ccart={};reb();});
  $('#ccheckout').addEventListener('click',()=>{const items=lines.map(x=>({pid:x[0],qty:x[1]}));const ship=(c.state==='Gujarat'&&total>=499)?0:79;
    openModal(`<h2 style="font-size:19px">Checkout</h2><div style="margin-top:12px">${itemsTable(items,'customer')}</div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:12px"><label class="fld">Deliver to<input id="co_addr" value="${esc(c.name)}, ${esc(c.city)}, ${esc(c.state)}"></label><label class="fld">Payment<select id="co_pay"><option>Prepaid (UPI)</option><option>Cash on delivery</option></select></label></div>
      <div class="soft" style="padding:12px;margin-top:12px"><div class="spread tiny"><span class="muted">Items</span><b>${inr(total)}</b></div><div class="spread tiny"><span class="muted">Delivery</span><b>${ship?inr(ship):'Free'}</b></div><div class="spread" style="margin-top:6px;font-family:var(--font-display);font-size:18px"><span>To pay</span><span style="color:var(--accent-deep)">${inr(total+ship)}</span></div></div>
      <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Back</button><button class="btn primary" id="co_ok">Place order</button></div>`);
    $('#co_ok').addEventListener('click',()=>{if(DEMO.ordersPlaced>=DEMO.maxOrders){toast('Prototype limit — up to '+DEMO.maxOrders+' orders per session.','warn');return;}DEMO.ordersPlaced++;const o={id:'CO-'+(cSeq++),customer:c.id,placed:NOW.getTime(),items,total:total+ship,payment:$('#co_pay').value,status:'Placed',shipment:null,history:[{t:NOW.getTime(),label:'Order placed on customer portal',by:c.name}]};CORDERS.unshift(o);c.orders++;c.spent+=o.total;STATE.ccart={};closeModal();STATE.cRoute='orders';renderCustomer();toast('Order '+o.id+' placed — you will get WhatsApp updates at every step','good');});});}
function cOrders(v){const c=myCustomer();const mine=CORDERS.filter(o=>o.customer===c.id);
  v.innerHTML=`<div class="page-head"><div class="eyebrow">${esc(c.name)}</div><h1>My orders</h1></div><div class="stack">${mine.map(o=>{const sh=o.shipment?SHMAP()[o.shipment]:null;return `<div class="card" style="padding:14px 16px"><div class="spread"><div><b class="mono">${o.id}</b> <span class="muted tiny">· ${fmtDT(o.placed)} · ${esc(o.payment)}</span><div class="tiny" style="margin-top:4px">${o.items.map(i=>esc(PMAP[i.pid].name.replace('Chehar ',''))+' ×'+i.qty).join(' · ')}</div></div><div class="row"><b class="num">${inr(o.total)}</b>${statusChip(o.status)}${sh?`<button class="btn primary sm" data-ctrack="${sh.id}">Courier details</button>`:''}</div></div>${sh?`<div class="tiny muted" style="margin-top:6px">${esc(sh.courier)} · AWB <span class="mono">${sh.awb}</span> · ${sh.deliveredAt?'delivered '+fmtD(sh.deliveredAt):'expected by '+fmtD(sh.estDelivery)}</div>`:''}${stepper(CSTAGES,o.status)}</div>`;}).join('')||'<div class="card empty">No orders yet.</div>'}</div>`;
  $$('[data-ctrack]',v).forEach(b=>b.addEventListener('click',()=>portalShipModal(b.dataset.ctrack)));}
function cTrack(v){const c=myCustomer();const mine=CORDERS.filter(o=>o.customer===c.id&&o.shipment).map(o=>SHMAP()[o.shipment]).sort((a,b)=>b.dispatchedAt-a.dispatchedAt);const live=mine.filter(s=>!s.deliveredAt);
  v.innerHTML=`<div class="page-head"><div class="eyebrow">${esc(c.name)} · ${esc(c.city)}</div><h1>Deliveries</h1><div class="muted tiny" style="margin-top:3px">${live.length?live.length+' order'+(live.length===1?'':'s')+' with the courier':'Nothing in transit right now'} · track on the courier's website with your AWB number</div></div>${deliveriesTable(mine,'customer')}`;
  $$('[data-rec]',v).forEach(b=>b.addEventListener('click',()=>portalShipModal(b.dataset.rec)));$$('[data-copyawb]',v).forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.copyawb,'AWB copied')));}

/* ---------- boot ---------- */
document.documentElement.setAttribute('data-theme','light');
renderLogin();
</script>
